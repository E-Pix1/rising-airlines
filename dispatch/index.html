<!DOCTYPE html>
<html>
<head>
  <title>Rising Airlines Dispatch</title>
  <style>
    body {
      font-family: Arial;
      background: #eef3ff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #0033cc;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      background: #0033cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #002699;
    }
  </style>
</head>

<body>

<h1>Rising Airlines Dispatch</h1>

<div class="box">
  <form action="http://13.75.216.37:3000/api/create_ofp" method="POST">

    <label>SimBrief User ID</label>
    <input name="userid" required>

    <label>Flight Number</label>
    <input name="flight_number" placeholder="RA123" required>

    <label>Origin Airport</label>
    <input name="origin" placeholder="YSSY" required>

    <label>Destination Airport</label>
    <input name="destination" placeholder="YMML" required>

    <label>Aircraft Type</label>
    <input name="aircraft" placeholder="B738" required>

    <label>Route (optional)</label>
    <input name="route" placeholder="DCT">

    <button type="submit">Generate OFP</button>
  </form>
</div>

</body>
</html>
