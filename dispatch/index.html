<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rising Airlines Dispatch Center</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0033cc;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 700px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 15px;
      background: #0033cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #002699;
    }
  </style>
</head>
<body>

<header>Rising Airlines Dispatch Center</header>

<div class="container">
  <form action="http://13.75.216.37:3000/api/create_ofp" method="POST">

    <label>SimBrief User ID</label>
    <input type="text" name="userid" placeholder="Your SimBrief ID" required>

    <label>Flight Number</label>
    <input type="text" name="flight_number" placeholder="RA123" required>

    <label>Origin Airport</label>
    <input type="text" name="origin" placeholder="YSSY" required>

    <label>Destination Airport</label>
    <input type="text" name="destination" placeholder="YMML" required>

    <label>Aircraft Type</label>
    <select name="aircraft" required>
      <option value="A20N">Airbus A320neo</option>
      <option value="A320">Airbus A320</option>
      <option value="B738">Boeing 737-800</option>
      <option value="B39M">Boeing 737 MAX 9</option>
      <option value="B789">Boeing 787-9</option>
      <option value="A359">Airbus A350-900</option>
    </select>

    <label>Route (optional)</label>
    <input type="text" name="route" placeholder="DCT">

    <button type="submit">Generate OFP</button>
  </form>
</div>

</body>
</html>
